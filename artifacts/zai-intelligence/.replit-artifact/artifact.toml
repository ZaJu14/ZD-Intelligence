kind = "web"
previewPath = "/"
title = "ZAI Intelligence"
version = "1.0.0"
id = "artifacts/zai-intelligence"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/zai-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zai-intelligence", "run", "build" ]
publicDir = "artifacts/zai-intelligence/out"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
